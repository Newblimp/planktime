name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # the unit + asset checks need nothing installed, so run them first:
      # they fail in ~150ms instead of after a browser download
      - name: Unit checks
        run: npm run test:unit

      - name: Install Playwright + Chromium
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: End-to-end checks
        run: npm run test:e2e
